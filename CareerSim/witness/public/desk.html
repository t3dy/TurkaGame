<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Researcher’s Desk — Ibn Turka: The Occult Court</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--parchment:#f4ecd9;--deep:#e9dcc0;--ink:#2b2118;--faint:#7a6a56;
      --lapis:#1f4d8f;--vermillion:#9b2c1f;--gold:#a8842c;--verdigris:#3e6b5a;--line:#c9b992;}
@media (prefers-color-scheme:dark){:root{--parchment:#171310;--deep:#211b16;--ink:#e8dcc4;
      --faint:#8f8270;--lapis:#5b8bd0;--vermillion:#d0584a;--gold:#c9a648;--verdigris:#6fa08c;--line:#3a3128;}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--parchment);color:var(--ink);font-family:'EB Garamond',Georgia,serif;line-height:1.6;font-size:17px}
.sheet{max-width:72rem;margin:0 auto;padding:2.4rem 1.3rem 6rem}
a{color:var(--lapis)}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.9rem;font-weight:600;text-align:center}
.sub{color:var(--faint);font-style:italic;font-size:.92rem;text-align:center;margin-bottom:1.8rem}
.rubric{display:flex;align-items:center;gap:.8rem;color:var(--vermillion);font-variant:small-caps;
        letter-spacing:.14em;font-size:.78rem;margin:2.2rem 0 1rem}
.rubric::before,.rubric::after{content:'';flex:1;border-top:1px solid var(--line)}
.stats{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin-bottom:.6rem}
.stat{background:var(--deep);border:1px solid var(--line);border-radius:3px;padding:.55rem 1.1rem;text-align:center;min-width:7.5rem}
.stat b{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:1.5rem}
.stat span{font-variant:small-caps;letter-spacing:.1em;font-size:.72rem;color:var(--faint)}
.filters{display:flex;gap:.5rem;justify-content:center;margin:.8rem 0 1rem;flex-wrap:wrap}
.filters button{font-family:inherit;font-variant:small-caps;letter-spacing:.08em;font-size:.8rem;
  background:var(--parchment);color:var(--ink);border:1px solid var(--line);border-radius:2px;padding:.25rem .9rem;cursor:pointer}
.filters button.on{border-color:var(--lapis);color:var(--lapis)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{font-variant:small-caps;letter-spacing:.1em;font-size:.72rem;color:var(--vermillion);text-align:left;
   border-bottom:1px solid var(--line);padding:.35rem .6rem}
td{border-bottom:1px dotted var(--line);padding:.4rem .6rem;vertical-align:top}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.origin{font-variant:small-caps;letter-spacing:.08em;font-size:.78rem}
.origin.simulated{color:var(--faint)}
.origin.played{color:var(--verdigris)}
.touched{color:var(--vermillion);font-weight:600}
.qgroup{background:var(--deep);border:1px solid var(--line);border-radius:3px;padding:1rem 1.2rem;margin-bottom:1rem}
.qhead{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap;margin-bottom:.5rem}
.qhead b{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.15rem}
.qhead .tag{font-variant:small-caps;letter-spacing:.1em;font-size:.7rem;border:1px solid currentColor;border-radius:2px;padding:0 .4rem}
.tag.scholar{color:var(--vermillion)}
.qitem{border-left:2px solid var(--line);padding:.25rem 0 .25rem .7rem;margin:.45rem 0;font-size:.88rem}
.qitem.scholar{border-left-color:var(--vermillion)}
.qitem.player{border-left-color:var(--lapis)}
.qitem .meta{font-variant:small-caps;letter-spacing:.07em;font-size:.7rem;color:var(--faint)}
.qitem .meta b.scholar{color:var(--vermillion)}
.qitem .meta b.player{color:var(--lapis)}
.was{color:var(--faint);font-style:italic}
.err,.loading{text-align:center;color:var(--faint);font-style:italic;padding:4rem 0}
.colophon{margin-top:3rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--faint);
          font-size:.8rem;font-style:italic;text-align:center}
</style>
</head>
<body>
<div class="sheet" id="sheet"><p class="loading">Opening the desk…</p></div>
<script type="module">
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key = new URLSearchParams(location.search).get('key');
const when = (ts) => { const d = new Date(ts); return isNaN(d) ? '—' : d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); };
const HAND = { scholar: 'the scholar’s hand', player: 'the player’s hand' };

let DATA = null;
let filter = 'all';

function witnessRows() {
  let rows = DATA.witnesses;
  if (filter === 'played' || filter === 'simulated') rows = rows.filter((w) => w.origin === filter);
  if (filter === 'touched') rows = rows.filter((w) => w.revisions + w.annotations > 0);
  if (filter === 'scholar') rows = rows.filter((w) => w.scholarTouched);
  return rows;
}

function render() {
  const t = DATA.totals;
  const rows = witnessRows();
  $('#sheet').innerHTML = `
    <h1>The Researcher’s Desk</h1>
    <p class="sub">every published witness, and every hand that has touched one</p>
    <div class="stats">
      <div class="stat"><b>${t.witnesses}</b><span>witnesses</span></div>
      <div class="stat"><b>${t.played}</b><span>played</span></div>
      <div class="stat"><b>${t.simulated}</b><span>simulated</span></div>
      <div class="stat"><b>${t.revisions}</b><span>revisions</span></div>
      <div class="stat"><b>${t.annotations}</b><span>notes</span></div>
      <div class="stat"><b>${t.scholarTouched}</b><span>scholar-touched</span></div>
    </div>

    <div class="rubric">THE PRIORITY QUEUE — WHAT THE HANDS HAVE OBJECTED TO, BY ENCOUNTER</div>
    ${DATA.queue.length ? DATA.queue.map((g) => `
      <div class="qgroup">
        <div class="qhead"><b>${esc(g.encounterId)}</b>
          ${g.scholar ? '<span class="tag scholar">scholar</span>' : ''}
          <span class="qitem meta">${g.items.length} act${g.items.length > 1 ? 's' : ''}, latest ${esc(when(g.latest))}</span></div>
        ${g.items.map((i) => `
          <div class="qitem ${esc(i.hand)}">
            ${i.op === 'revise'
              ? `<span class="was">“${esc(i.old)}”</span> → “${esc(i.new)}”${i.field ? ` <span class="meta">(${esc(i.field)})</span>` : ''}`
              : esc(i.text)}
            <div class="meta"><b class="${esc(i.hand)}">${esc(i.author)}</b> · ${esc(HAND[i.hand] || i.hand)} · ${esc(when(i.ts))} ·
              <a href="w.html?id=${esc(i.witnessId)}">${esc(i.witnessTitle)}</a></div>
          </div>`).join('')}
      </div>`).join('')
    : '<p class="err">No editorial acts yet. When a hand corrects or annotates a witness, it surfaces here, grouped by the encounter it touches.</p>'}

    <div class="rubric">ALL WITNESSES</div>
    <div class="filters">
      ${['all', 'played', 'simulated', 'touched', 'scholar'].map((f) =>
        `<button data-f="${f}" class="${filter === f ? 'on' : ''}">${f}</button>`).join('')}
    </div>
    <div class="tablewrap"><table>
      <tr><th>witness</th><th>origin</th><th>published</th><th>the man</th><th>the system</th>
          <th style="text-align:right">entries</th><th style="text-align:right">rev</th><th style="text-align:right">notes</th><th>last edit</th></tr>
      ${rows.map((w) => `
        <tr>
          <td><a href="w.html?id=${esc(w.id)}">${esc(w.title)}</a></td>
          <td class="origin ${esc(w.origin)}">${esc(w.origin)}</td>
          <td>${esc(when(w.createdAt))}</td>
          <td>${esc((w.verdict || {}).manTitle || '—')}</td>
          <td>${esc((w.verdict || {}).systemTitle || '—')}</td>
          <td class="n">${w.entries}</td>
          <td class="n ${w.revisions ? 'touched' : ''}">${w.revisions}</td>
          <td class="n ${w.annotations ? 'touched' : ''}">${w.annotations}</td>
          <td>${w.lastEditedAt ? esc(when(w.lastEditedAt)) : '—'}</td>
        </tr>`).join('')}
    </table></div>
    <p class="colophon">Ibn Turka: The Occult Court · the desk is private; the witnesses it lists are not ·
      editorial state derived from the immutable edits/ blobs, never from counters</p>`;
}

document.addEventListener('click', (e) => {
  const f = e.target.closest('[data-f]');
  if (f) { filter = f.dataset.f; render(); }
});

if (!key) { $('#sheet').innerHTML = '<p class="err">The desk needs its key.</p>'; }
else {
  fetch('/api/desk?key=' + encodeURIComponent(key)).then((r) => r.json()).then((d) => {
    if (d.error) { $('#sheet').innerHTML = `<p class="err">${esc(d.error)}</p>`; return; }
    DATA = d; render();
  }).catch((e) => { $('#sheet').innerHTML = `<p class="err">The desk could not be read. ${esc(e.message)}</p>`; });
}
</script>
</body>
</html>
