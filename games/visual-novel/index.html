<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ibn Turka — A Visual Novel (prototype)</title>
<style>
  :root {
    --ink: #2a2016; --parchment: #f4ecd8; --gold: #9c7a2e; --rule: #c9b892;
    --card-bg: #fbf6ea; --navy: #1c2b3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--navy); color: var(--parchment);
    font-family: Georgia, "Times New Roman", serif; line-height: 1.6;
  }
  #app { max-width: 40rem; margin: 0 auto; padding: 2rem 1.25rem 5rem; }
  .scene { background: var(--parchment); color: var(--ink); border-radius: 8px;
    padding: 1.5rem 1.75rem; border: 1px solid var(--rule); position: relative; }
  .backdrop { width: 100%; max-height: 16rem; object-fit: cover; border-radius: 6px;
    margin-bottom: 1rem; border: 1px solid var(--rule); }
  .act-badge { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--gold); margin-bottom: 0.4rem; }
  .grounding-badge { display: inline-block; font-size: 0.68rem; text-transform: uppercase;
    letter-spacing: 0.04em; border: 1px solid var(--rule); border-radius: 999px;
    padding: 0.1rem 0.5rem; color: #6b5e47; float: right; }
  h2 { margin: 0.3rem 0 0.6rem; font-size: 1.3rem; }
  .scene-text { font-size: 1rem; margin-bottom: 1.2rem; }
  .options { display: flex; flex-direction: column; gap: 0.6rem; }
  .option-btn {
    font-family: inherit; font-size: 0.95rem; text-align: left;
    background: var(--card-bg); border: 1px solid var(--rule); border-radius: 5px;
    padding: 0.7rem 1rem; cursor: pointer; color: var(--ink);
  }
  .option-btn:hover { background: #f0e4c8; border-color: var(--gold); }
  .gated-note { font-size: 0.8rem; color: #8a7a5a; font-style: italic; margin-top: 0.8rem; }
  .skill-panel { background: var(--card-bg); color: var(--ink); border-radius: 8px;
    border: 1px solid var(--rule); padding: 1rem 1.25rem; margin-top: 1rem; }
  .skill-panel h3 { margin: 0 0 0.6rem; font-size: 0.85rem; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--gold); }
  .skill-row { display: grid; grid-template-columns: 9rem 1fr 1.5rem; align-items: center;
    gap: 0.6rem; font-size: 0.82rem; margin-bottom: 0.35rem; }
  .skill-bar { height: 0.5rem; background: #e5d8b8; border-radius: 999px; overflow: hidden; }
  .skill-fill { height: 100%; background: var(--gold); }
  .skill-val { text-align: right; }
  .progress { text-align: center; font-size: 0.78rem; color: #9c8f74; margin-top: 0.8rem; }
  .ending { background: var(--card-bg); color: var(--ink); border-radius: 8px;
    padding: 2rem 1.75rem; border: 1px solid var(--rule); }
  .ending h1 { margin-top: 0; }
  .ending-text { font-size: 1.05rem; }
  .ending-note { font-size: 0.85rem; font-style: italic; color: #6b5e47; }
  a.back { color: #cbb98a; font-size: 0.85rem; display: inline-block; margin: 1rem 0 0 1.25rem; }
</style>
</head>
<body>
<a class="back" href="../../site/features.html">&larr; TurkaGame</a>
<div id="app"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
