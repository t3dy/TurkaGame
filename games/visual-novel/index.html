<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ibn Turka — A Visual Novel (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2a2016; --parchment: #f4ecd8; --gold: #b6924f; --gold-deep: #9c7a2e;
    --gold-bright: #e8cf8a; --rule: #c9b892; --card-bg: #fbf6ea;
    --navy: #16212c; --navy-deep: #0d141c;
    --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --body: Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--parchment);
    font-family: var(--body); line-height: 1.65;
    background:
      radial-gradient(ellipse 120% 70% at 50% -10%, #1d2c3b 0%, var(--navy) 45%, var(--navy-deep) 100%);
    background-attachment: fixed;
    min-height: 100vh;
  }
  a.back {
    color: #cbb98a; font-size: 0.85rem; display: inline-block;
    margin: 1rem 0 0 1.25rem; text-decoration: none; opacity: 0.8;
  }
  .version-banner {
    max-width: 41rem; margin: 0.5rem auto 0; padding: 0 1.25rem;
    font-size: 0.8rem; color: #8fa0b3; text-align: right;
  }
  .version-banner a { color: var(--gold-bright); }
  a.back:hover { opacity: 1; text-decoration: underline; }
  #app { max-width: 41rem; margin: 0 auto; padding: 1.25rem 1.25rem 5rem; }

  h1, h2, h3, .title-h1, .act-h1 { font-family: var(--display); }

  /* --- shared card look --- */
  .title-card, .act-card, .scene, .consequence-card, .ending {
    background: var(--card-bg); color: var(--ink); border-radius: 12px;
    padding: 1.75rem 1.9rem; border: 1px solid var(--rule);
    box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset, 0 14px 40px rgba(0,0,0,0.45);
    animation: fadein 0.4s ease-out;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* --- veiled cards: manuscript image behind a deep tint (title + act screens) --- */
  .veiled {
    position: relative; overflow: hidden; color: var(--parchment);
    border-color: #3a4a5c;
    background:
      linear-gradient(rgba(13,20,28,0.82), rgba(13,20,28,0.9)),
      var(--veil-img, none) center / cover no-repeat, var(--navy-deep);
  }
  .veiled-inner { position: relative; }
  .veiled .title-desc, .veiled .act-text { color: #e5dbc2; }

  .option-btn {
    font-family: var(--body); font-size: 0.95rem; text-align: left;
    background: #fff9ec; border: 1px solid var(--rule); border-radius: 7px;
    padding: 0.75rem 1.05rem; cursor: pointer; color: var(--ink);
    transition: background 0.15s, border-color 0.15s, transform 0.12s, box-shadow 0.15s;
    display: flex; align-items: baseline; gap: 0.65rem;
  }
  .option-btn:hover {
    background: #f6ead0; border-color: var(--gold-deep);
    transform: translateX(3px); box-shadow: -3px 0 0 0 var(--gold-deep);
  }
  .option-btn:active { transform: translateX(3px) scale(0.99); }
  .option-btn:focus-visible { outline: 3px solid var(--gold-deep); outline-offset: 2px; }
  .option-btn.primary {
    background: linear-gradient(180deg, #ab8536, var(--gold-deep));
    color: #fdf7e3; border-color: #86671f;
    justify-content: center; font-weight: bold; letter-spacing: 0.02em;
  }
  .option-btn.primary:hover { background: linear-gradient(180deg, #b78f3d, #8a6c22); box-shadow: none; transform: none; }
  .option-btn.ghost {
    background: transparent; color: var(--gold-bright); border-color: #5a6a7c;
    justify-content: center;
  }
  .option-btn.ghost:hover { border-color: var(--gold-bright); background: rgba(232,207,138,0.08); box-shadow: none; transform: none; }
  .option-key {
    font-size: 0.7rem; font-weight: bold; color: var(--gold-deep);
    border: 1px solid var(--rule); border-radius: 4px;
    padding: 0.05rem 0.4rem; flex-shrink: 0;
  }
  .option-btn-detailed { align-items: flex-start; padding: 0.85rem 1.1rem; }
  .option-btn-detailed .option-key { margin-top: 0.2rem; }
  .option-body { display: flex; flex-direction: column; gap: 0.3rem; }
  .option-label { font-weight: bold; font-size: 0.98rem; }
  .option-detail { font-size: 0.86rem; color: #5c4e38; line-height: 1.55; font-weight: normal; }

  /* --- ornament: khatam seal + flanking rules --- */
  .ornament-rule { display: flex; align-items: center; gap: 0.9rem; margin: 0.9rem auto 1.1rem; max-width: 22rem; }
  .ornament-line { flex: 1; height: 1px; background: currentColor; opacity: 0.35; }
  .seal { display: block; margin: 0 auto; }

  /* --- title screen --- */
  .screen-title { display: flex; align-items: center; min-height: calc(100vh - 4rem); }
  .title-card { text-align: center; padding: 3.2rem 2rem; width: 100%; }
  .title-card .seal { margin-bottom: 0.9rem; }
  .title-eyebrow { font-size: 0.72rem; letter-spacing: 0.18em; color: var(--gold-bright); margin-bottom: 0.5rem; }
  .title-h1 { font-size: 3.4rem; font-weight: 600; margin: 0 0 0.2rem; letter-spacing: 0.01em; }
  .title-sub { font-style: italic; color: var(--gold-bright); margin: 0 0 1.5rem; }
  .title-desc { font-size: 0.97rem; max-width: 32rem; margin: 0 auto 1.9rem; }
  .title-actions { display: flex; flex-direction: column; gap: 0.7rem; max-width: 18rem; margin: 0 auto; }
  .title-hint { font-size: 0.75rem; color: #8fa0b3; margin-top: 1.4rem; }

  /* --- act-intro screen --- */
  .screen-act { display: flex; align-items: center; min-height: calc(100vh - 4rem); }
  .act-card { text-align: center; padding: 3.2rem 2rem; width: 100%; }
  .act-eyebrow { font-size: 0.72rem; letter-spacing: 0.22em; color: var(--gold-bright); margin-bottom: 0.5rem; }
  .act-h1 { font-size: 2.3rem; font-weight: 600; margin: 0 0 0.2rem; }
  .act-card .ornament-rule { color: var(--gold-bright); }
  .act-text { font-size: 1.08rem; font-style: italic; max-width: 30rem; margin: 0 auto 1.9rem; }
  .act-card .option-btn.primary { max-width: 14rem; margin: 0 auto; width: 100%; }

  /* --- choice screen --- */
  .backdrop-frame {
    border: 1px solid var(--rule); border-radius: 8px; padding: 0.35rem;
    background: #efe5cd; margin-bottom: 1rem;
  }
  .backdrop {
    display: block; width: 100%; max-height: 15rem; object-fit: cover;
    border-radius: 5px; filter: saturate(0.92);
  }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.3rem; }
  .act-badge { font-size: 0.73rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--gold-deep); }
  .grounding-badge {
    font-size: 0.63rem; text-transform: uppercase; letter-spacing: 0.05em;
    border: 1px solid var(--rule); border-radius: 999px; padding: 0.12rem 0.6rem;
    color: #7a6a45; cursor: help;
  }
  .grounding-badge:focus-visible { outline: 2px solid var(--gold-deep); outline-offset: 1px; }
  h2 { margin: 0.2rem 0 0.7rem; font-size: 1.55rem; font-weight: 600; }
  .scene-text { font-size: 1rem; margin-bottom: 1.35rem; }
  .dropcap::first-letter {
    font-family: var(--display); font-size: 3.1em; font-weight: 600;
    float: left; line-height: 0.82; padding: 0.06em 0.12em 0 0;
    color: var(--gold-deep);
  }
  .options { display: flex; flex-direction: column; gap: 0.6rem; }
  .gated-note { font-size: 0.8rem; color: #8a7a5a; font-style: italic; margin-top: 0.95rem; }
  .gated-mark { color: #a3542e; font-style: normal; }

  /* --- consequence screen --- */
  .screen-consequence { display: flex; align-items: center; min-height: calc(100vh - 4rem); }
  .consequence-card { text-align: center; padding: 2.6rem 2rem; width: 100%; }
  .consequence-card .ornament-rule { color: var(--gold-deep); }
  .consequence-text { font-size: 1.12rem; font-style: italic; max-width: 30rem; margin: 0 auto 1.4rem; }
  .gain-chips { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-bottom: 1.5rem; }
  .gain-chip {
    font-size: 0.78rem; font-weight: bold; letter-spacing: 0.02em;
    color: #fdf7e3; background: var(--chip-color, var(--gold-deep));
    border-radius: 999px; padding: 0.22rem 0.75rem;
    animation: chipin 0.45s ease-out;
  }
  @keyframes chipin { from { opacity: 0; transform: translateY(6px) scale(0.9); } to { opacity: 1; transform: none; } }
  .consequence-card .option-btn.primary { max-width: 14rem; margin: 0 auto; width: 100%; }

  /* --- skill panel + act progress --- */
  .skill-panel { background: var(--card-bg); color: var(--ink); border-radius: 12px;
    border: 1px solid var(--rule); padding: 1rem 1.25rem; margin-top: 1rem; }
  .skill-panel h3 { margin: 0 0 0.7rem; font-size: 0.95rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--gold-deep); }
  .skill-row { display: grid; grid-template-columns: 9.5rem 1fr 1.6rem; align-items: center;
    gap: 0.6rem; font-size: 0.82rem; margin-bottom: 0.42rem; }
  .skill-bar { height: 0.52rem; background: #e9ddc0; border-radius: 999px; overflow: hidden; }
  .skill-fill { height: 100%; border-radius: 999px; transition: width 0.35s ease; }
  .skill-val { text-align: right; font-variant-numeric: tabular-nums; }

  .act-progress { display: flex; gap: 0.3rem; margin-top: 0.9rem; padding: 0 0.2rem; }
  .act-seg { flex: 1; height: 0.32rem; background: rgba(244,236,216,0.14); border-radius: 999px; overflow: hidden; }
  .act-seg-fill { height: 100%; background: var(--gold); border-radius: 999px; transition: width 0.3s ease; }
  .act-seg.current { box-shadow: 0 0 0 1px rgba(232,207,138,0.5); }

  /* --- ending screen --- */
  .ending-head { text-align: center; }
  .ending-head .seal { margin-bottom: 0.7rem; }
  .ending-eyebrow { font-size: 0.72rem; letter-spacing: 0.18em; color: var(--gold-deep); margin-bottom: 0.3rem; }
  .ending h1 { margin: 0 0 0.9rem; font-size: 2.2rem; font-weight: 600; }
  .ending-text { font-size: 1.08rem; }
  .ending-note { font-size: 0.85rem; font-style: italic; color: #6b5e47; }
  .journal { margin-top: 1.2rem; border-top: 1px solid var(--rule); padding-top: 1rem; }
  .journal h3 { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold-deep); margin-bottom: 0.6rem; }
  .journal-act { font-family: var(--display); font-size: 1.02rem; font-weight: 700;
    color: var(--gold-deep); margin: 1rem 0 0.3rem; }
  .journal-row { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.85rem;
    padding: 0.28rem 0; border-bottom: 1px dotted var(--rule); }
  .journal-choice { color: #6b5e47; }
  .journal-pick { text-align: right; font-weight: 600; }
  .ending .option-btn { margin-top: 1.5rem; width: 100%; }

  @media (max-width: 30rem) {
    .title-h1 { font-size: 2.4rem; }
    .act-h1 { font-size: 1.7rem; }
    .skill-row { grid-template-columns: 7rem 1fr 1.4rem; font-size: 0.75rem; }
    .scene, .title-card, .act-card, .consequence-card, .ending { padding: 1.25rem 1.3rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .title-card, .act-card, .scene, .consequence-card, .ending, .gain-chip { animation: none; }
    .option-btn, .skill-fill, .act-seg-fill { transition: none; }
  }
</style>
</head>
