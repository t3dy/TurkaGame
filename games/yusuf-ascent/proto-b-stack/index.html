<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype B — The Impossible Stack</title>
<link rel="stylesheet" href="../shared/theme.css?v=1">
<style>
  body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #stage { flex: 1 1 auto; position: relative; min-height: 0; background: #16151a; }
  canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: absolute; left: 12px; bottom: 12px;
    display: flex; flex-direction: column; gap: 8px;
    font-family: var(--sans); color: var(--paper); font-size: .74rem;
    background: rgba(22,21,26,.82);
    border: 1px solid var(--gold);
    padding: 10px 12px;
    width: 270px;
  }
  #hud label { display: flex; align-items: center; gap: .5rem; letter-spacing: .05em; }
  #hud input[type=range] { flex: 1 1 auto; accent-color: var(--gold); }
  #hud .row { display: flex; gap: 6px; flex-wrap: wrap; }
  #hud .val { width: 34px; text-align: right; opacity: .7; }

  #readout {
    position: absolute; right: 12px; top: 12px; width: 300px; max-height: calc(100% - 24px);
    overflow-y: auto;
  }
  #ladder {
    position: absolute; left: 12px; top: 12px;
    font-family: var(--sans); font-size: .68rem; color: var(--paper);
    display: flex; flex-direction: column-reverse; gap: 2px;
  }
  #ladder div {
    padding: 2px 8px; border-left: 3px solid;
    background: rgba(22,21,26,.7);
    letter-spacing: .06em;
  }
  #ladder div small { opacity: .55; }

  #hint {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    font-family: var(--sans); font-size: .7rem; color: #9b9490;
    background: rgba(22,21,26,.8); padding: 4px 10px; border: 1px solid var(--rule);
    pointer-events: none;
  }
  @media (max-width: 860px) {
    #readout { position: static; width: auto; margin: 8px; }
    #ladder { display: none; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <span class="title">The Impossible Stack</span>
    <span class="sep">·</span>
    <span>Prototype B — station-point 3D</span>
    <span class="spacer"></span>
    <button class="btn active" id="mode-station">Station point</button>
    <button class="btn" id="mode-orbit">Orbit</button>
    <button class="btn" id="mode-climb">Climb</button>
    <a href="../index.html">← all prototypes</a>
  </div>

  <div id="stage">
    <div id="ladder"></div>
    <div class="card" id="readout"></div>
    <div id="hud">
      <label>Explode <input type="range" id="explode" min="0" max="100" value="0"><span class="val" id="explode-v">0</span></label>
      <label>Drift <input type="range" id="drift" min="0" max="100" value="0"><span class="val" id="drift-v">0</span></label>
      <div class="row">
        <button class="btn" id="dbg-rung">Rung colours</button>
        <button class="btn" id="dbg-wire">Edges</button>
        <button class="btn" id="reset">Reset view</button>
      </div>
    </div>
    <div id="hint">drag to orbit · scroll to dolly · click a panel</div>
  </div>

<script type="module" src="./app.js?v=1"></script>
</body>
</html>
