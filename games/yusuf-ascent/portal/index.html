<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Palace That Is Not a Building — a deep dive</title>
<link rel="stylesheet" href="../shared/theme.css?v=1">
<style>
  html, body { background: #201e25; }
  main {
    max-width: 1180px; margin: 0 auto; padding: 0 16px 80px;
    display: grid; grid-template-columns: 200px minmax(0,1fr); gap: 28px;
  }
  nav {
    position: sticky; top: 12px; align-self: start;
    font-family: var(--sans); font-size: .74rem; padding-top: 24px;
  }
  nav a { display: block; color: #b3aaa0; text-decoration: none; padding: 3px 0; border-left: 2px solid transparent; padding-left: 8px; }
  nav a:hover, nav a.on { color: var(--gold-bright); border-left-color: var(--gold); }

  article { padding-top: 24px; color: var(--paper); }
  article h1 { font-size: 1.9rem; margin: 0 0 .2rem; color: var(--paper); line-height: 1.18; }
  article .sub { font-family: var(--sans); font-size: .82rem; color: #9b9490; margin-bottom: 1.6rem; }
  article h2 {
    font-size: 1.15rem; margin: 2.4rem 0 .7rem; color: var(--gold-bright);
    border-bottom: 1px solid rgba(201,154,46,.3); padding-bottom: .3rem;
  }
  article h3 { font-size: .98rem; margin: 1.4rem 0 .3rem; color: var(--paper); }
  article p { line-height: 1.68; font-size: .95rem; color: #ddd4c9; }
  article ul { line-height: 1.62; font-size: .93rem; color: #ddd4c9; }

  .hero { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 1rem; }
  .hero img { width: 260px; border: 1px solid var(--gold); outline: 3px solid var(--lapis); outline-offset: 2px; }
  .hero dl { font-family: var(--sans); font-size: .76rem; margin: 0; flex: 1 1 260px; }
  .hero dt { color: var(--vermilion-hi); letter-spacing: .1em; text-transform: uppercase; font-size: .62rem; margin-top: .55rem; }
  .hero dd { margin: .1rem 0 0; color: var(--paper); }

  .tag {
    display: inline-block; font-family: var(--sans); font-size: .58rem; letter-spacing: .13em;
    text-transform: uppercase; padding: .1rem .42rem; border-radius: 2px; vertical-align: .12em;
    margin-right: .4rem;
  }
  .t-ATTESTED  { background: #2e8f8f; color: #06201f; }
  .t-CORPUS    { background: var(--lapis-dim); color: #fff; }
  .t-FIELD     { background: #7a6f52; color: #fff; }
  .t-INFERENCE { background: var(--vermilion); color: #fff; }
  .t-NEGATIVE  { background: #5a4a5e; color: #fff; }
  .t-CLEARABLE { background: #2e8f8f; color: #06201f; }

  .entry {
    border-left: 3px solid rgba(201,154,46,.35); padding: .1rem 0 .1rem .9rem;
    margin: 1rem 0;
  }
  .entry .who { font-family: var(--sans); font-size: .74rem; color: #9b9490; margin-top: .3rem; }
  .entry.contested { border-left-color: var(--vermilion); }
  .entry .warn { font-family: var(--sans); font-size: .74rem; color: var(--vermilion-hi); margin-top: .35rem; }

  table { width: 100%; border-collapse: collapse; font-size: .84rem; margin-top: .6rem; }
  th, td { text-align: left; padding: .42rem .5rem; border-bottom: 1px solid rgba(241,218,193,.13); vertical-align: top; color: #ddd4c9; }
  th { font-family: var(--sans); font-size: .64rem; letter-spacing: .12em; text-transform: uppercase; color: #9b9490; }

  .rungrow { display: flex; align-items: flex-start; gap: .7rem; margin: .55rem 0; }
  .rungrow .bar { width: 4px; align-self: stretch; border-radius: 2px; }
  .rungrow b { color: var(--paper); }
  .rungrow span { font-size: .88rem; color: #ddd4c9; }

  .gallery { display: flex; flex-wrap: wrap; gap: 6px; margin-top: .7rem; }
  .gallery figure { margin: 0; width: 104px; }
  .gallery img { width: 104px; height: 104px; object-fit: cover; border: 1px solid var(--rule); display: block; background:#000; }
  .gallery figcaption { font-family: var(--sans); font-size: .58rem; color: #9b9490; margin-top: 2px; line-height: 1.3; }

  .callout {
    background: rgba(30,63,122,.28); border: 1px solid var(--lapis-dim);
    padding: .8rem 1rem; margin: 1.2rem 0;
  }
  .callout p { margin: .3rem 0 0; }
  .callout strong { color: var(--gold-bright); }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    nav { position: static; display: flex; flex-wrap: wrap; gap: .4rem; }
    nav a { border-left: none; padding-left: 0; }
  }
</style>
</head>

  <div class="topbar">

<script type="module" src="./portal.js?v=1"></script>

</html>
