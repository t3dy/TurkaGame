<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap">
<title>The Unmaking — three ways to bring a structure down</title>
<link rel="stylesheet" href="../shared/hand.css?v=7">
<style>
  :root {
    --paper:#f1dac1; --dim:#b9b0a6; --bg:#171620; --bg2:#211f2b; --bg3:#2b2836;
    --gold:#c99a2e; --gold-hi:#e8c86a; --lapis:#4d7fd6; --verm:#c06523;
    --turq:#2e8f8f; --rule:rgba(241,218,193,.16);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:"Inter","Segoe UI",system-ui,sans-serif;
    --mono:"Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--paper);
    font-family:var(--serif);overflow:hidden}
  a{color:var(--verm)}
  .topbar{display:flex;align-items:baseline;gap:.9rem;flex-wrap:wrap;padding:.5rem 1rem;
    background:#100f16;border-bottom:1px solid var(--gold);font-family:var(--sans);font-size:.76rem}
  .topbar .title{font-family:var(--serif);font-size:1rem}
  .topbar .ar{font-size:1.05rem;color:var(--gold-hi)}
  .topbar .spacer{flex:1}
  .topbar a{text-decoration:none}.topbar a:hover{text-decoration:underline}

  #wrap{display:flex;height:calc(100% - 34px)}
  #stage{flex:1;position:relative;min-width:0}
  #stage canvas{display:block;width:100%;height:100%}
  #panel{width:360px;flex:0 0 360px;background:var(--bg2);border-left:1px solid var(--gold);
    display:flex;flex-direction:column;overflow-y:auto;padding:10px;gap:10px}

  .btn{font-family:var(--sans);font-size:.72rem;padding:.34rem .6rem;border:1px solid var(--gold);
    border-radius:2px;background:transparent;color:var(--paper);cursor:pointer}
  .btn:hover{background:rgba(201,154,46,.16)}
  .btn.active{background:var(--gold);color:#16151a}
  .btn.wide{width:100%;text-align:left;margin-bottom:4px}
  .row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .lab{font-family:var(--sans);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--dim);margin-bottom:.25rem}
  .frame{border:1px solid var(--rule);border-left:2px solid var(--gold);border-radius:2px;
    padding:.5rem .6rem;background:rgba(0,0,0,.16);font-family:var(--sans);font-size:.72rem;line-height:1.5}
  .frame h4{margin:0 0 .3rem;font-size:.72rem;font-weight:500;color:var(--gold-hi);
    letter-spacing:.06em;text-transform:uppercase}
  .frame .fact{color:#ddd4c9} .frame .reading{color:var(--dim);font-style:italic;margin-top:.25rem}

  .pill{font-family:var(--sans);font-size:.55rem;letter-spacing:.09em;padding:.08rem .4rem;
    border-radius:2px;background:var(--rule);color:var(--paper);white-space:nowrap}
  .pill.INTERPRETATION{background:#5a5468;color:#fff}
  .pill.GAME_FICTION{background:var(--verm);color:#fff}
  .pill.PLAIN{background:#4a4a52;color:#fff}

  table.cmp{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:.7rem}
  table.cmp th{text-align:left;color:var(--dim);font-weight:500;padding:.25rem .3rem;
    border-bottom:1px solid var(--rule)}
  table.cmp td{padding:.25rem .3rem;border-bottom:1px solid var(--rule);vertical-align:top}
  table.cmp td b{color:var(--gold-hi)}
  table.cmp tr.best td{background:rgba(201,154,46,.12)}

  #say{font-family:var(--mono);font-size:.68rem;min-height:1.2rem;padding:.25rem .4rem;
    border-radius:2px;color:var(--dim)}
  #say.bad{color:#f0b98a;background:rgba(192,101,35,.14)}
  #say.good{color:var(--gold-hi);background:rgba(201,154,46,.12)}
  #score{font-family:var(--mono);font-size:.74rem;color:var(--gold-hi)}
  #legend{position:absolute;left:10px;bottom:8px;font-family:var(--sans);font-size:.62rem;
    color:var(--dim);background:rgba(16,15,22,.8);padding:.3rem .5rem;border-radius:2px}
</style>
</head>
<body>
  <div class="topbar">
    <span class="title">The Unmaking</span>
    <span class="ar">النقض</span>
    <span style="opacity:.35">·</span>
    <span>three ways to bring a structure down &mdash; only one of them is sourced</span>
    <span class="spacer"></span>
    <button class="btn" id="style" style="padding:.2rem .5rem">Draw in Ink</button>
    <a href="../../index.html">All prototypes</a>
    <a href="../../HANDOVER.md">v2</a>
  </div>

  <div id="wrap">
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="legend">click a letter to aim &middot; the dashed marks are what the chosen route <b>would</b> do</div>
    </div>

    <aside id="panel">
      <div>
        <div class="lab">Structure</div>
        <div class="row" id="structures"></div>
      </div>
      <div id="score"></div>
      <div id="say"></div>

      <div>
        <div class="lab">Route</div>
        <div id="routes"></div>
      </div>

      <div class="frame" id="route-frame"></div>

      <div class="row">
        <button class="btn" id="do">Do it</button>
        <button class="btn" id="reset">Rebuild</button>
        <button class="btn" id="compare">Try all three</button>
      </div>

      <div>
        <div class="lab">Comparison — same structure, same target</div>
        <table class="cmp" id="cmp"><tbody><tr><td style="color:var(--dim)">Press <b>Try all three</b>.</td></tr></tbody></table>
      </div>

      <div class="frame" id="verdict"></div>
    </aside>
  </div>

<script type="module" src="./src/ui.js?v=7"></script>
</body>
</html>
