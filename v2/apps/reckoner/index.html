<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Reckoner — four ways of acting on what already stands</title>
<link rel="stylesheet" href="../shared/hand.css?v=6">
<style>
  :root {
    --paper:#f1dac1; --dim:#b9b0a6; --bg:#171620; --bg2:#211f2b; --bg3:#2b2836;
    --gold:#c99a2e; --gold-hi:#e8c86a; --lapis:#4d7fd6; --verm:#c06523;
    --turq:#2e8f8f; --rule:rgba(241,218,193,.16);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:"Inter","Segoe UI",system-ui,sans-serif;
    --mono:"Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--paper);
    font-family:var(--serif);overflow:hidden}
  a{color:var(--verm)}
  .topbar{display:flex;align-items:baseline;gap:.9rem;flex-wrap:wrap;padding:.5rem 1rem;
    background:#100f16;border-bottom:1px solid var(--gold);font-family:var(--sans);font-size:.76rem}
  .topbar .title{font-family:var(--serif);font-size:1rem}
  .topbar .ar{font-size:1.05rem;color:var(--gold-hi)}
  .topbar .spacer{flex:1}
  .topbar a{text-decoration:none}.topbar a:hover{text-decoration:underline}

  #wrap{display:flex;height:calc(100% - 34px)}
  #stage{flex:1;position:relative;min-width:0}
  #stage canvas{display:block;width:100%;height:100%}
  #panel{width:350px;flex:0 0 350px;background:var(--bg2);border-left:1px solid var(--gold);
    display:flex;flex-direction:column;overflow-y:auto;padding:10px;gap:10px}

  .btn{font-family:var(--sans);font-size:.72rem;padding:.34rem .6rem;border:1px solid var(--gold);
    border-radius:2px;background:transparent;color:var(--paper);cursor:pointer}
  .btn:hover{background:rgba(201,154,46,.16)}
  .btn.active{background:var(--gold);color:#16151a}
  .btn:disabled{opacity:.3;cursor:default}
  .btn.wide{width:100%;text-align:left;margin-bottom:4px}
  .row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .lab{font-family:var(--sans);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--dim);margin-bottom:.25rem}
  .hidden{display:none!important}
  input[type=number]{background:var(--bg3);color:var(--paper);border:1px solid var(--rule);
    padding:.3rem .4rem;font-family:var(--mono);font-size:.8rem;border-radius:2px;width:6rem}

  .frame{border:1px solid var(--rule);border-left:2px solid var(--gold);border-radius:2px;
    padding:.5rem .6rem;background:rgba(0,0,0,.16);font-family:var(--sans);font-size:.72rem;line-height:1.5}
  .frame h4{margin:0 0 .3rem;font-size:.72rem;font-weight:500;color:var(--gold-hi);
    letter-spacing:.06em;text-transform:uppercase}
  .frame.teach{border-left-color:var(--turq)}

  #hand{display:flex;gap:6px;flex-wrap:wrap}
  .lt{width:50px;height:50px;border-radius:2px;cursor:pointer;border:1px solid #7d6338;
    background:linear-gradient(#efe0c2,#dcc79f);color:#2a2113;
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .lt.dark{background:linear-gradient(#4d4870,#3b3757);color:#e6dcf3;border-color:#221f38}
  .lt.sel{outline:2px solid var(--gold-hi);outline-offset:2px}
  .lt .g{font-size:1.45rem}
  .lt .v{font-family:var(--mono);font-size:.5rem;opacity:.7}

  #say{font-family:var(--mono);font-size:.68rem;min-height:1.2rem;padding:.25rem .4rem;
    border-radius:2px;color:var(--dim)}
  #say.bad{color:#f0b98a;background:rgba(192,101,35,.14)}
  #say.good{color:var(--gold-hi);background:rgba(201,154,46,.12)}
  #verdict{font-family:var(--sans);font-size:.8rem;padding:.4rem .6rem;border-radius:2px}
  #verdict.win{background:rgba(201,154,46,.2);border:1px solid var(--gold);color:var(--gold-hi)}
  #verdict.lose{background:rgba(0,0,0,.2);border:1px solid var(--rule);color:var(--dim)}
  #verdict.fell{background:rgba(192,101,35,.16);border:1px solid var(--verm);color:#f0b98a}

  #probes .btn{width:100%;text-align:left;margin-bottom:3px}
  #findings{list-style:none;margin:.3rem 0 0;padding:0;font-family:var(--sans);font-size:.68rem}
  #findings li{padding:.25rem 0 .25rem .5rem;border-left:2px solid var(--lapis);margin-bottom:.25rem;color:#ddd4c9}
  #findings li b{color:var(--gold-hi)}
  #legend{position:absolute;left:10px;bottom:8px;font-family:var(--sans);font-size:.62rem;
    color:var(--dim);background:rgba(16,15,22,.8);padding:.3rem .5rem;border-radius:2px}
</style>
</head>
<body>
  <div class="topbar">
    <span class="title">The Reckoner</span>
    <span class="ar">الحاسب</span>
    <span style="opacity:.35">·</span>
    <span>four ways of acting on what already stands</span>
    <span class="spacer"></span>
    <button class="btn" id="style" style="padding:.2rem .5rem">Draw in Ink</button>
    <a href="../../index.html">All prototypes</a>
    <a href="../../HANDOVER.md">v2</a>
  </div>

  <div id="wrap">
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="legend"></div>
    </div>

    <aside id="panel">
      <div>
        <div class="lab">Puzzle</div>
        <div class="row" id="levels"></div>
      </div>
      <div class="frame" id="brief"></div>
      <div id="verdict"></div>
      <div id="say"></div>

      <!-- extract -->
      <div id="ui-extract" class="hidden">
        <div class="lab">Write the word — click a letter, then a cell</div>
        <div id="hand"></div>
        <div class="row" style="margin-top:6px">
          <button class="btn" id="do-extract">Extract every <span id="doomed"></span></button>
          <button class="btn" id="reset-extract">Start over</button>
        </div>
      </div>

      <!-- reckon -->
      <div id="ui-reckon" class="hidden">
        <div class="lab">Name a number</div>
        <div class="row">
          <input type="number" id="number" value="90" min="1" max="4000">
          <button class="btn" id="do-reckon">Reckon</button>
          <button class="btn" id="reset-reckon">Rebuild</button>
        </div>
        <div class="frame" style="margin-top:6px" id="values"></div>
      </div>

      <!-- assay -->
      <div id="ui-assay" class="hidden">
        <div class="lab">Probes — each one asks the world a question</div>
        <div id="probes"></div>
        <div class="lab" style="margin-top:8px">What you have seen</div>
        <ul id="findings"><li style="border-left-color:var(--rule);color:var(--dim)">Nothing yet.</li></ul>
        <div class="lab" style="margin-top:8px">Name the metaphysics</div>
        <div id="guesses"></div>
      </div>

      <!-- station -->
      <div id="ui-station" class="hidden">
        <div class="lab">From which direction does it read?</div>
        <div id="dirs"></div>
        <div class="frame" style="margin-top:6px" id="reading"></div>
      </div>

      <div class="frame teach" id="teach"></div>
    </aside>
  </div>

<script type="module" src="./src/ui.js?v=6"></script>
</body>
</html>
