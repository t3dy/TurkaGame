<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Pushing Floor — shove what you can, write what you cannot</title>
<link rel="stylesheet" href="../shared/hand.css?v=6">
<style>
  :root {
    --paper:#f1dac1; --dim:#b9b0a6; --bg:#171620; --bg2:#211f2b; --bg3:#2b2836;
    --gold:#c99a2e; --gold-hi:#e8c86a; --lapis:#4d7fd6; --verm:#c06523;
    --turq:#2e8f8f; --rule:rgba(241,218,193,.16);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:"Inter","Segoe UI",system-ui,sans-serif;
    --mono:"Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--paper);
    font-family:var(--serif);overflow:hidden}
  a{color:var(--verm)}
  .topbar{display:flex;align-items:baseline;gap:.9rem;flex-wrap:wrap;padding:.5rem 1rem;
    background:#100f16;border-bottom:1px solid var(--gold);font-family:var(--sans);font-size:.76rem}
  .topbar .title{font-family:var(--serif);font-size:1rem}
  .topbar .ar{font-size:1.05rem;color:var(--gold-hi)}
  .topbar .spacer{flex:1}
  .topbar a{text-decoration:none}.topbar a:hover{text-decoration:underline}

  #wrap{display:flex;height:calc(100% - 34px)}
  #stage{flex:1;position:relative;min-width:0}
  #stage canvas{display:block;width:100%;height:100%}
  #panel{width:330px;flex:0 0 330px;background:var(--bg2);border-left:1px solid var(--gold);
    display:flex;flex-direction:column;overflow-y:auto;padding:10px;gap:11px}

  .btn{font-family:var(--sans);font-size:.72rem;padding:.34rem .6rem;border:1px solid var(--gold);
    border-radius:2px;background:transparent;color:var(--paper);cursor:pointer}
  .btn:hover{background:rgba(201,154,46,.16)}
  .btn.active{background:var(--gold);color:#16151a}
  .btn:disabled{opacity:.3;cursor:default}
  .row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .lab{font-family:var(--sans);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--dim);margin-bottom:.25rem}
  .frame{border:1px solid var(--rule);border-left:2px solid var(--gold);border-radius:2px;
    padding:.5rem .6rem;background:rgba(0,0,0,.16);font-family:var(--sans);font-size:.72rem;line-height:1.5}
  .frame h4{margin:0 0 .3rem;font-size:.72rem;font-weight:500;color:var(--gold-hi);
    letter-spacing:.06em;text-transform:uppercase}
  .frame.teach{border-left-color:var(--turq)}

  #hand{display:flex;gap:6px;flex-wrap:wrap}
  .lt{width:52px;height:52px;border-radius:2px;cursor:pointer;border:1px solid #7d6338;
    background:linear-gradient(#efe0c2,#dcc79f);color:#2a2113;
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .lt.dark{background:linear-gradient(#4d4870,#3b3757);color:#e6dcf3;border-color:#221f38}
  .lt.sel{outline:2px solid var(--gold-hi);outline-offset:2px}
  .lt .g{font-size:1.5rem}
  .lt .v{font-family:var(--mono);font-size:.5rem;opacity:.7}

  #say{font-family:var(--mono);font-size:.68rem;min-height:1.2rem;padding:.25rem .4rem;
    border-radius:2px;color:var(--dim)}
  #say.bad{color:#f0b98a;background:rgba(192,101,35,.14)}
  #say.good{color:var(--gold-hi);background:rgba(201,154,46,.12)}
  #verdict{font-family:var(--sans);font-size:.8rem;padding:.4rem .6rem;border-radius:2px}
  #verdict.win{background:rgba(201,154,46,.2);border:1px solid var(--gold);color:var(--gold-hi)}
  #verdict.lose{background:rgba(0,0,0,.2);border:1px solid var(--rule);color:var(--dim)}
  #legend{position:absolute;left:10px;bottom:8px;font-family:var(--sans);font-size:.62rem;
    color:var(--dim);background:rgba(16,15,22,.8);padding:.3rem .5rem;border-radius:2px}
</style>
</head>
<body>
  <div class="topbar">
    <span class="title">The Pushing Floor</span>
    <span class="ar">أرض الدفع</span>
    <span style="opacity:.35">·</span>
    <span>shove what you can, write what you cannot</span>
    <span class="spacer"></span>
    <button class="btn" id="style" style="padding:.2rem .5rem">Draw in Ink</button>
    <a href="../scriptorium/index.html">The Scriptorium</a>
    <a href="../../README.md">v2</a>
  </div>

  <div id="wrap">
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="legend">arrow keys or WASD to walk &middot; click a letter, then a cell beside you, to write it</div>
    </div>

    <aside id="panel">
      <div>
        <div class="lab">Floor</div>
        <div class="row" id="levels"></div>
      </div>

      <div class="frame" id="brief"></div>
      <div id="verdict"></div>
      <div id="say"></div>

      <div>
        <div class="lab">In hand — spent when written</div>
        <div id="hand"></div>
      </div>

      <div class="frame" id="letter"></div>

      <div class="row">
        <button class="btn" id="undo">Undo</button>
        <button class="btn" id="reset">Reset floor</button>
      </div>

      <div class="frame teach" id="teach"></div>
    </aside>
  </div>

<script type="module" src="./src/ui.js?v=6"></script>
</body>
</html>
